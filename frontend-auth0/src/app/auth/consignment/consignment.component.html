<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="flex items-center justify-between">
    <div><h1 class="text-2xl font-bold text-gray-900">Consignments</h1><p class="mt-1 text-sm text-gray-600">Stock held by shops before it is sold.</p></div>
    <a routerLink="/consignment/new" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">New consignment</a>
  </div>
  <p *ngIf="error" class="mt-6 rounded bg-red-50 p-3 text-red-700">{{ error }}</p>
  <p *ngIf="loading" class="mt-6 text-gray-600">Loading consignments…</p>
  <div *ngIf="!loading" class="mt-6 overflow-hidden rounded-lg bg-white shadow ring-1 ring-black/5">
    <table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600">Number</th><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600">Shop / customer</th><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600">Date</th><th class="px-4 py-3 text-left text-xs font-semibold text-gray-600">Status</th><th></th></tr></thead>
      <tbody class="divide-y divide-gray-200"><tr *ngFor="let item of consignments"><td class="px-4 py-3 text-sm">{{ item.consignment_number }}</td><td class="px-4 py-3 text-sm">{{ item.customer_name }}</td><td class="px-4 py-3 text-sm">{{ item.consignment_date | date }}</td><td class="px-4 py-3 text-sm">{{ item.status }}</td><td class="px-4 py-3 text-right"><a [routerLink]="['/consignment', item.id]" class="text-sm font-medium text-indigo-600">View</a></td></tr><tr *ngIf="consignments.length === 0"><td colspan="5" class="px-4 py-8 text-center text-sm text-gray-500">No consignments yet.</td></tr></tbody>
    </table>
  </div>
</div>
