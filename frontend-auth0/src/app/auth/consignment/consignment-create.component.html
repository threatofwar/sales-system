<div class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8"><div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">New consignment</h1><p class="mt-1 text-sm text-gray-600">This moves stock to a shop but does not create a sale or invoice.</p></div>
<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6 rounded-lg bg-white p-6 shadow ring-1 ring-black/5">
  <p *ngIf="error" class="rounded bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
  <div class="grid gap-4 sm:grid-cols-3"><label class="block text-sm font-medium">Shop / customer<select formControlName="customer_id" class="mt-1 block w-full rounded border-gray-300"><option [ngValue]="0">Select customer</option><option *ngFor="let customer of customers" [ngValue]="customer.id">{{ customer.display_name || customer.company_name || ((customer.first_name || '') + ' ' + (customer.last_name || '')) }}</option></select></label><label class="block text-sm font-medium">Date<input formControlName="consignment_date" type="date" class="mt-1 block w-full rounded border-gray-300"></label><label class="block text-sm font-medium">Default commission %<input formControlName="commission_rate" type="number" min="0" max="100" step="0.01" class="mt-1 block w-full rounded border-gray-300"></label></div>
  <div formArrayName="items" class="space-y-3"><div class="flex items-center justify-between"><h2 class="font-semibold">Products sent</h2><button type="button" (click)="addItem()" class="text-sm font-medium text-indigo-600">Add product</button></div><div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="grid gap-3 rounded border p-3 sm:grid-cols-5"><select formControlName="product_id" (change)="fillPrice(i)" class="rounded border-gray-300 sm:col-span-2"><option [ngValue]="0">Select product</option><option *ngFor="let product of products" [ngValue]="product.id">{{ product.name }} (stock: {{ product.stock_quantity }})</option></select><input formControlName="quantity" type="number" min="1" placeholder="Quantity" class="rounded border-gray-300"><input formControlName="unit_price" type="number" min="0.01" step="0.01" placeholder="Selling price" class="rounded border-gray-300"><button type="button" (click)="removeItem(i)" class="text-sm text-red-600">Remove</button></div></div>
  <label class="block text-sm font-medium">Notes<textarea formControlName="notes" rows="2" class="mt-1 block w-full rounded border-gray-300"></textarea></label>
  <div class="flex justify-end gap-3"><a routerLink="/consignment" class="rounded px-4 py-2 text-sm font-semibold">Cancel</a><button [disabled]="saving" class="rounded bg-indigo-600 px-4 py-2 text-sm font-semibold text-white disabled:bg-gray-400">{{ saving ? 'Saving…' : 'Create consignment' }}</button></div>
</form></div>
