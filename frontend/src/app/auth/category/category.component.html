<div class="space-y-6">

    <!-- Header -->
    <app-page-header
        title="Categories"
        description="Manage all your categories."
        addText="Add Category"
        addRoute="/category/new"
    />


    <!-- Search -->
    <app-search-box
    placeholder="Search categories..."
    />

    <!-- Loading -->
    <div
        *ngIf="loading"
        class="rounded-lg bg-white p-6 text-center text-sm text-gray-500 shadow"
    >
        Loading categories...
    </div>


    <!-- Error -->
    <div
        *ngIf="!loading && errorMessage"
        class="rounded-lg bg-red-50 p-4 text-sm text-red-600 shadow"
    >
        {{ errorMessage }}
    </div>


    <!-- Table -->
    <div
        *ngIf="!loading && !errorMessage"
        class="overflow-hidden rounded-lg bg-white shadow"
    >

        <div class="overflow-x-auto">

            <table class="min-w-full divide-y divide-gray-200">

                <thead class="bg-gray-50">

                    <tr>

                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">
                            ID
                        </th>

                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">
                            Name
                        </th>

                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">
                            Description
                        </th>

                        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">
                            Created
                        </th>

                        <th class="px-6 py-3 text-right text-xs font-semibold uppercase tracking-wider text-gray-500">
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody class="divide-y divide-gray-200 bg-white">

                    <tr
                        *ngFor="let category of categories"
                        class="hover:bg-gray-50"
                    >

                        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-700">
                            {{ category.id }}
                        </td>

                        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-700">
                            {{ category.name }}
                        </td>

                        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-700">
                            {{ category.description || '-' }}
                        </td>

                        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-700">
                            {{ category.created_at | date:'dd/MM/yyyy HH:mm' }}
                        </td>

                        <td class="whitespace-nowrap px-6 py-4 text-right text-sm">

                            <a
                                [routerLink]="['/category', category.id, 'edit']"
                                class="mr-3 font-medium text-indigo-600 hover:text-indigo-900"
                            >
                                Edit
                            </a>

                            <button
                                type="button"
                                (click)="deleteCategory(category.id!)"
                                class="font-medium text-red-600 hover:text-red-900">
                                Delete
                            </button>
                        </td>
                    </tr>


                    <!-- Empty state -->
                    <tr
                        *ngIf="categories.length === 0"
                        class="hover:bg-gray-50"
                    >

                        <td
                            colspan="5"
                            class="px-6 py-4 text-center text-sm text-gray-500"
                        >
                            No categories found.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
