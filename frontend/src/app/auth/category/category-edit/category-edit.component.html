<div class="space-y-6">

    <!-- Header -->

    <div>
        <h1 class="text-2xl font-bold text-gray-900">
            Edit Category
        </h1>

        <p class="mt-1 text-sm text-gray-500">
            Update the category information.
        </p>
    </div>


    <!-- Loading -->

    <div
        *ngIf="loading"
        class="rounded-lg bg-white p-6 shadow"
    >
        <p class="text-sm text-gray-500">
            Loading category...
        </p>
    </div>


    <!-- Error -->

    <div
        *ngIf="!loading && errorMessage"
        class="rounded-md bg-red-50 p-4"
    >
        <p class="text-sm text-red-700">
            {{ errorMessage }}
        </p>
    </div>


    <!-- Form -->

    <div
        *ngIf="!loading && !errorMessage"
        class="rounded-lg bg-white p-6 shadow"
    >

        <form
            (ngSubmit)="updateCategory()"
            #categoryForm="ngForm"
            class="space-y-6"
        >

            <!-- Category Name -->

            <div>

                <label
                    for="name"
                    class="block text-sm font-medium text-gray-700"
                >
                    Category Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    [(ngModel)]="category.name"
                    required
                    maxlength="100"
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="Enter category name"
                >

            </div>


            <!-- Description -->

            <div>

                <label
                    for="description"
                    class="block text-sm font-medium text-gray-700"
                >
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    [(ngModel)]="category.description"
                    rows="4"
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="Enter category description"
                ></textarea>

            </div>


            <!-- Success -->

            <div
                *ngIf="successMessage"
                class="rounded-md bg-green-50 p-4"
            >
                <p class="text-sm text-green-700">
                    {{ successMessage }}
                </p>
            </div>


            <!-- Error -->

            <div
                *ngIf="errorMessage"
                class="rounded-md bg-red-50 p-4"
            >
                <p class="text-sm text-red-700">
                    {{ errorMessage }}
                </p>
            </div>


            <!-- Buttons -->

            <div class="flex items-center justify-end gap-3">

                <a
                    routerLink="/category"
                    class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    [disabled]="saving || categoryForm.invalid"
                    class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                >
                    {{ saving ? 'Saving...' : 'Save Changes' }}
                </button>

            </div>

        </form>

    </div>

</div>
