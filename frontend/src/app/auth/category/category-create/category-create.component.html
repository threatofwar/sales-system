<div class="space-y-6">

    <!-- Header -->
    <app-page-header
        title="Categories"
        description="Manage all your categories."
        addText="Add Category"
        addRoute="/category/new"
    />


    <!-- Error -->

    <div
        *ngIf="errorMessage"
        class="rounded-md bg-red-50 p-4 text-sm text-red-600"
    >
        {{ errorMessage }}
    </div>


    <!-- Form -->

    <div class="rounded-lg bg-white p-6 shadow">

        <form
            (ngSubmit)="createCategory()"
            #categoryForm="ngForm"
        >

            <!-- Name -->

            <div>

                <label
                    for="name"
                    class="block text-sm font-medium text-gray-700"
                >
                    Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    [(ngModel)]="category.name"
                    required
                    maxlength="100"
                    placeholder="e.g. Snacks"
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                >

            </div>


            <!-- Description -->

            <div class="mt-5">

                <label
                    for="description"
                    class="block text-sm font-medium text-gray-700"
                >
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    [(ngModel)]="category.description"
                    rows="4"
                    placeholder="Enter category description..."
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                ></textarea>

            </div>


            <!-- Buttons -->

            <div class="mt-6 flex justify-end gap-3">

                <a
                    routerLink="/category"
                    class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm hover:bg-gray-50"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    [disabled]="loading || categoryForm.invalid"
                    class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
                >

                    <span *ngIf="!loading">
                        Create Category
                    </span>

                    <span *ngIf="loading">
                        Creating...
                    </span>

                </button>

            </div>

        </form>

    </div>

</div>
